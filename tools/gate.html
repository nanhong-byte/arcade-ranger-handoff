<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ArcadeRanger 美術交接站</title>
<style>
:root{--paper:#F5F5F5;--card:#FFFFFF;--ink:#161415;--muted:#6B6766;--gold:#FDC302;--gold-ink:#8A6400;--line:#DDDAD6;--bad:#B3261E}
@media (prefers-color-scheme:dark){:root{--paper:#121111;--card:#1C1B1B;--ink:#F1EEEA;--muted:#A8A39E;--gold:#FDC302;--gold-ink:#FDC302;--line:#34312F;--bad:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.7 "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;padding:16px;
 background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
.box{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 26px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--gold-ink);font-weight:700}
h1{margin:4px 0 6px;font-size:26px;line-height:1.3}
p{margin:0 0 14px;color:var(--muted);font-size:14px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:10px 0 16px;font-size:14px;color:var(--muted)}
.row input{width:auto}
button{width:100%;font:inherit;font-weight:700;padding:11px;border:0;border-radius:8px;background:var(--ink);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--bad)}
.bar{height:3px;width:56px;background:var(--gold);border-radius:2px;margin:10px 0 16px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="eyebrow">PUMPKIN VR · 公司內部</div>
  <h1>ArcadeRanger 美術交接站</h1>
  <div class="bar"></div>
  <p>內容已加密，只有南瓜虛擬科技夥伴能開。密碼放在公司雲端「ArcadeRanger 美術交接（阿賊）2026-11」資料夾的「交接站密碼」文件，要用 <b>@pumpkinvrar.com</b> 帳號登入 Google 才打得開。</p>
  <label for="pw">密碼</label>
  <input id="pw" type="password" required autofocus>
  <div class="row"><input id="keep" type="checkbox" checked><label for="keep" style="margin:0;font-weight:400">在這台電腦記住（公用電腦請取消）</label></div>
  <button id="go" type="submit">打開交接站</button>
  <div class="msg" id="msg" role="alert"></div>
</form>
<script>
const P=__PAYLOAD__;const KEY="ar_handoff_pw";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.d));
  const html=new TextDecoder().decode(buf);
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),msg=document.getElementById("msg"),go=document.getElementById("go");
f.addEventListener("submit",async e=>{e.preventDefault();const pw=document.getElementById("pw").value;const keep=document.getElementById("keep").checked;go.disabled=true;msg.textContent="解鎖中…";
  try{await open(pw);try{if(keep)localStorage.setItem(KEY,pw);}catch(_){}}
  catch(err){go.disabled=false;msg.textContent="密碼不對，請再確認一次。";}});
(async()=>{let saved=null;try{saved=localStorage.getItem(KEY);}catch(_){}
  if(saved){try{await open(saved);try{localStorage.setItem(KEY,saved);}catch(_){}}catch(_){try{localStorage.removeItem(KEY);}catch(__){}}}})();
</script>
</body>
</html>
